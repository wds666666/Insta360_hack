[project]
name = "insta360-hack"
version = "0.1.0"
description = "Handwritten image-to-3d workflow API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
]

[project.scripts]
insta360-hack = "insta360_hack.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
